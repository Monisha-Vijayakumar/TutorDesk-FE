<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="baseGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94a3b8" fill-opacity="0.3"/>
    </pattern>
    <!-- Dots fade out towards the centre so the text stays clean -->
    <radialGradient id="edgeFade" cx="50%" cy="50%" r="65%">
      <stop offset="0.3" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </radialGradient>
    <mask id="edgeMask">
      <rect width="1440" height="900" fill="url(#edgeFade)"/>
    </mask>
  </defs>

  <rect width="1440" height="900" fill="url(#baseGradient)"/>

  <g filter="url(#softBlur)">
    <circle cx="180" cy="140" r="260" fill="#c7d2fe" fill-opacity="0.55"/>
    <circle cx="1300" cy="200" r="240" fill="#bae6fd" fill-opacity="0.5"/>
    <circle cx="1180" cy="830" r="300" fill="#ddd6fe" fill-opacity="0.45"/>
    <circle cx="240" cy="850" r="220" fill="#a7f3d0" fill-opacity="0.35"/>
  </g>

  <rect width="1440" height="900" fill="url(#dotGrid)" mask="url(#edgeMask)"/>
</svg>
